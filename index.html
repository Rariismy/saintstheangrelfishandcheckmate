<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой дневник</title>
<style>
  /* ============ НАСТРОЙКИ (меняй здесь) ============ */
  :root {
    --desk: #3b2a35;
    --desk-2: #2a1d26;
    --w: 3; --h: 4;              /* пропорции ОДНОЙ страницы (ширина : высота). Подстрой под свои картинки */
    --paper: #fdf6e3;            /* цвет бумаги, если картинки нет */
    --link-hover: rgba(255, 105, 180, .22);
  }

  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 30%, var(--desk), var(--desk-2));
    font-family: Georgia, "Times New Roman", serif; color: #fff;
    display: flex; flex-direction: column; overflow: hidden;
    touch-action: pan-y;
  }

  /* сцена: книга всегда по центру и максимально большая */
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .book {
    position: relative; perspective: 2200px;
    aspect-ratio: var(--w) / var(--h);
    height: min(100%, calc((100vw - 24px) * var(--h) / var(--w)));
  }

  /* ============ ЛИСТЫ ============ */
  .leaf, .base {
    position: absolute; inset: 0;
    background: var(--paper) center / 100% 100% no-repeat;
    border-radius: 4px 12px 12px 4px;
  }
  .base { background-image: url("page-2.jpg"); box-shadow: 0 20px 50px rgba(0,0,0,.55); }  /* ← содержание */

  .leaf {
    background: none;
    transform-origin: left center; transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(.5,.05,.2,1), opacity .3s;
  }
  .leaf.flipped {
    transform: rotateY(-178deg); opacity: 0; pointer-events: none;
    transition: transform 1.1s cubic-bezier(.5,.05,.2,1), opacity .4s .7s;
  }
  .face {
    position: absolute; inset: 0; border-radius: inherit;
    background: var(--paper) center / 100% 100% no-repeat;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 0; padding: 0; display: block;
  }
  .face.back { transform: rotateY(180deg); }

  .leaf.cover { z-index: 3; }
  .leaf.cover .front { background-image: url("cover.jpg"); background-color: #c2185b; cursor: pointer;   /* ← обложка */
    box-shadow: 0 20px 50px rgba(0,0,0,.55), inset 6px 0 10px rgba(0,0,0,.35); }
  .leaf.page1 { z-index: 2; }
  .leaf.page1 .front { background-image: url("page-1.jpg"); box-shadow: 0 20px 50px rgba(0,0,0,.45); }   /* ← владелец */

  /* ============ ИКОНКА МУЗЫКИ (на первой странице) ============ */
  .music {
    position: absolute; top: 4%; right: 5%; width: 13%; aspect-ratio: 1;   /* ← положение и размер иконки */
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; cursor: pointer; color: #5a2a45; font-size: 2rem; padding: 0;
    transition: opacity .2s, transform .2s;
  }
  .music img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .music:hover { transform: scale(1.08); }
  .music:focus-visible { outline: 3px dashed #e91e63; border-radius: 8px; }
  .music.off { opacity: .45; }
  .music.off::after {                     /* перечёркивание, когда музыка выключена */
    content: ""; position: absolute; left: 8%; right: 8%; top: 50%; height: 3px;
    background: #5a2a45; border-radius: 2px; transform: rotate(-45deg);
  }

  //* ============ КЛИКАБЕЛЬНОЕ СОДЕРЖАНИЕ (на странице page-2) ============ */
  /* каждое название — отдельная картинка title-1.png … title-7.png, лежащая поверх страницы */
  .base .link {
    position: absolute; left: 12%; width: 76%; height: 8%;     /* рамка, в которую вписывается картинка */
    display: flex; align-items: center; justify-content: center;
    color: #5a2a45; font-size: min(3.6vw, 2.6vh); text-align: center; line-height: 1.1;  /* так выглядит текст, если картинки нет */
    text-decoration: none;
  }
  .base .link img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; transition: transform .2s, filter .2s; }
  .base a.link:hover img, .base a.link:focus-visible img { transform: scale(1.06); filter: drop-shadow(0 0 6px rgba(255,105,180,.9)); }
  .base a.link:focus-visible { outline: 2px dashed #e91e63; border-radius: 8px; }

  /* положение каждой зоны: top = отступ сверху в % от высоты страницы */
  .l1 { top: 16%; }
  .l2 { top: 27%; }
  .l3 { top: 38%; }
  .l4 { top: 49%; }
  .l5 { top: 60%; }
  .l6 { top: 71%; }
  .l7 { top: 82%; }
  .base .soon { cursor: default; }   /* «В разработке»: не ссылка, просто место под будущий раздел */

  /* ============ КНОПКИ ============ */
  .nav { display: flex; justify-content: center; gap: 12px; padding: 4px 12px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .nav button {
    background: #fdf6e3; color: #5a2a45; border: 0; border-radius: 22px;
    padding: 10px 24px; font: inherit; font-size: 1rem; cursor: pointer; min-width: 120px;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  .nav button:hover { background: #fff; }
  .nav button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* режим настройки: открой index.html?debug */
  body.debug .base a.link { background: rgba(0,200,255,.3); outline: 1px solid #0090c0; }
  body.debug .music { outline: 1px solid #0090c0; background: rgba(0,200,255,.3); }

  @media (prefers-reduced-motion: reduce) { .leaf, .leaf.flipped { transition: none; } }
</style>
</head>
<body>

<div class="stage">
  <div class="book" id="book">

    <!-- нижняя страница: содержание -->
    <nav class="base" aria-label="Содержание дневника">
      <a class="link l1" href="chapter1.html">Раздел 1</a>
      <a class="link l2" href="chapter2.html">Раздел 2</a>
      <a class="link l3" href="chapter3.html">Раздел 3</a>
      <a class="link l4" href="chapter4.html">Раздел 4</a>
      <a class="link l5" href="chapter5.html">Раздел 5</a>
    </nav>

    <!-- первая страница: информация о владельце + иконка музыки -->
    <div class="leaf page1" id="page1">
      <div class="face front">
        <button class="music" id="music" aria-label="Включить или выключить музыку">
          <img src="music-icon.png" alt="" onerror="this.replaceWith('♪')">
        </button>
      </div>
      <div class="face back"></div>
    </div>

    <!-- обложка -->
    <div class="leaf cover" id="cover">
      <button class="face front" id="coverBtn" aria-label="Открыть дневник"></button>
      <div class="face back"></div>
    </div>

  </div>
</div>

<div class="nav">
  <button id="prev">← Назад</button>
  <button id="next">Дальше →</button>
</div>

<audio id="audio" src="music.mp3" loop preload="auto"></audio>

<script>
  const $ = id => document.getElementById(id);
  const leaves = [$('cover'), $('page1')];   // 0 — обложка, 1 — первая страница, дальше — содержание
  const prev = $('prev'), next = $('next'), audio = $('audio'), musicBtn = $('music');
  let step = 0, musicOn = true, musicStarted = false;

  function go(n) {
    step = Math.max(0, Math.min(2, n));
    leaves.forEach((l, i) => l.classList.toggle('flipped', i < step));
    prev.style.visibility = step > 0 ? 'visible' : 'hidden';
    next.style.visibility = step < 2 ? 'visible' : 'hidden';
    // музыка стартует при первом открытии обложки (браузеры разрешают звук только после нажатия)
    if (step >= 1 && !musicStarted) {
      musicStarted = true;
      if (musicOn) audio.play().catch(() => {});
    }
  }

  musicBtn.addEventListener('click', () => {
    musicOn = !musicOn;
    musicBtn.classList.toggle('off', !musicOn);
    if (musicOn) audio.play().catch(() => {}); else audio.pause();
  });

  $('coverBtn').addEventListener('click', () => go(1));
  next.addEventListener('click', () => go(step + 1));
  prev.addEventListener('click', () => go(step - 1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(step + 1);
    if (e.key === 'ArrowLeft') go(step - 1);
  });

  // листание свайпом на телефоне
  let x0 = null;
  document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (dx < -60) go(step + 1); else if (dx > 60) go(step - 1);
  }, { passive: true });

  go(0);
  if (location.search.includes('debug')) { document.body.classList.add('debug'); go(1); }
</script>
</body>
</html>
