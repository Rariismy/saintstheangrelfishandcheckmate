<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой дневник</title>
<style>
  /* ============ НАСТРОЙКИ (меняй здесь) ============ */
  :root {
    --desk: #3b2a35;
    --desk-2: #2a1d26;
    --ratio: 3 / 4;             /* пропорции ОДНОЙ страницы: ширина / высота */
    --paper: #fdf6e3;           /* цвет бумаги, если картинки страницы нет */
    --link-hover: rgba(255, 105, 180, .22);
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 30%, var(--desk), var(--desk-2));
    font-family: Georgia, "Times New Roman", serif;
    color: #fff; min-height: 100vh; overflow-x: hidden;
  }
  button { font: inherit; }

  /* ============ ОБЛОЖКА ============ */
  .cover-screen {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 24px;
    perspective: 1800px;
  }
  .cover {
    width: min(90vw, calc(88vh * 3 / 4)); aspect-ratio: var(--ratio);
    transform-origin: left center;
    transition: transform 1.3s cubic-bezier(.5,.05,.2,1), opacity .4s ease 1s;
    cursor: pointer; border: 0; padding: 0; display: block;
    border-radius: 4px 14px 14px 4px;
    box-shadow: 0 25px 60px rgba(0,0,0,.55), inset 6px 0 10px rgba(0,0,0,.35);
    background: #c2185b url("cover.jpg") center / cover no-repeat;      /* ← обложка */
  }
  .cover:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
  .cover.open { transform: rotateY(-178deg); opacity: 0; pointer-events: none; }
  .cover-screen.gone { display: none; }

  /* ============ РАЗВОРОТЫ ============ */
  .spread-screen {
    display: none; min-height: 100vh; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 20px;
  }
  .spread-screen.show { display: flex; animation: appear .6s ease; }
  @keyframes appear { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

  .spread {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    width: min(96vw, calc(86vh * 3 / 2));
    perspective: 2400px;
    box-shadow: 0 25px 60px rgba(0,0,0,.55); border-radius: 6px;
  }
  .spread::after {            /* тень в корешке */
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 60px;
    transform: translateX(-50%); pointer-events: none; z-index: 5;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,.28), transparent);
  }
  .page {
    position: relative; aspect-ratio: var(--ratio);
    background: var(--paper) center / 100% 100% no-repeat;
  }
  .page.base-left  { background-image: url("page-1.jpg"); border-radius: 6px 0 0 6px; }  /* ← владелец */
  .page.base-right { background-image: url("page-4.jpg"); border-radius: 0 6px 6px 0; }  /* ← содержание */

  /* переворачиваемый лист: лицо = page-2.jpg, оборот = page-3.jpg */
  .leaf {
    position: absolute; top: 0; left: 50%; width: 50%; height: 100%;
    transform-origin: left center; transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(.5,.05,.2,1); z-index: 4;
  }
  .leaf.flipped { transform: rotateY(-180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--paper) center / 100% 100% no-repeat;
  }
  .face.front { background-image: url("page-2.jpg"); border-radius: 0 6px 6px 0; }
  .face.back  { background-image: url("page-3.jpg"); border-radius: 6px 0 0 6px; transform: rotateY(180deg); }

  /* кликабельные названия разделов (на странице page-4) */
  .page a.link {
    position: absolute; left: 12%; width: 76%; height: 8%;
    border-radius: 8px; color: transparent; text-decoration: none; overflow: hidden;
    transition: background .2s;
  }
  .page a.link:hover, .page a.link:focus-visible { background: var(--link-hover); outline: 2px dashed #e91e63; }
  .l1 { top: 18%; }
  .l2 { top: 30%; }
  .l3 { top: 42%; }
  .l4 { top: 54%; }
  .l5 { top: 66%; }

  /* кнопки листания */
  .nav { display: flex; gap: 12px; }
  .nav button {
    background: #fdf6e3; color: #5a2a45; border: 0; border-radius: 20px;
    padding: 10px 22px; font-size: 1rem; cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  .nav button:hover { background: #fff; }
  .nav button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .nav button[hidden] { display: none; }

  /* режим настройки: открой index.html?debug */
  body.debug .page a.link { background: rgba(0,200,255,.3); outline: 1px solid #0090c0; }

  /* ============ ТЕЛЕФОН: страницы друг под другом, без листания ============ */
  @media (max-width: 700px) {
    .spread { grid-template-columns: 1fr; width: min(94vw, 480px); gap: 14px; box-shadow: none; perspective: none; }
    .spread::after, .leaf, .nav { display: none; }
    .page { box-shadow: 0 12px 30px rgba(0,0,0,.5); border-radius: 6px !important; }
    .spread-screen { justify-content: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cover, .leaf, .spread-screen.show { transition: none; animation: none; }
  }
</style>
</head>
<body>

<main class="cover-screen" id="coverScreen">
  <button class="cover" id="cover" aria-label="Открыть дневник"></button>
  <p>Нажми на обложку, чтобы открыть дневник</p>
</main>

<main class="spread-screen" id="spreadScreen">
  <div class="spread">
    <!-- нижний слой: левая страница (владелец) и правая страница (содержание) -->
    <div class="page base-left" role="img" aria-label="Информация о владельце дневника"></div>
    <nav class="page base-right" aria-label="Содержание дневника">
      <a class="link l1" href="chapter1.html">Раздел 1</a>
      <a class="link l2" href="chapter2.html">Раздел 2</a>
      <a class="link l3" href="chapter3.html">Раздел 3</a>
      <a class="link l4" href="chapter4.html">Раздел 4</a>
      <a class="link l5" href="chapter5.html">Раздел 5</a>
    </nav>
    <!-- лист, который перелистывается поверх -->
    <div class="leaf" id="leaf" aria-hidden="true">
      <div class="face front"></div>
      <div class="face back"></div>
    </div>
  </div>

  <div class="nav">
    <button id="prev" hidden>← Назад</button>
    <button id="next">Листать →</button>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const cover = $('cover'), leaf = $('leaf'), prev = $('prev'), next = $('next');

  function openDiary() {
    cover.classList.add('open');
    setTimeout(() => {
      $('coverScreen').classList.add('gone');
      $('spreadScreen').classList.add('show');
      window.scrollTo(0, 0);
    }, 1100);
  }
  function flip(forward) {
    leaf.classList.toggle('flipped', forward);
    prev.hidden = !forward;
    next.hidden = forward;
  }
  cover.addEventListener('click', openDiary);
  next.addEventListener('click', () => flip(true));
  prev.addEventListener('click', () => flip(false));
  document.addEventListener('keydown', e => {
    if (!$('spreadScreen').classList.contains('show')) return;
    if (e.key === 'ArrowRight') flip(true);
    if (e.key === 'ArrowLeft') flip(false);
  });

  if (location.search.includes('debug')) {
    document.body.classList.add('debug');
    openDiary();
    setTimeout(() => flip(true), 1500);
  }
</script>
</body>
</html>
