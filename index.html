<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9a9bd">
  <title>Saints, the anglerfish, and checkmate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-label="Личный дневник">
    <div class="book-shell">
      <section class="page cover-page active" id="coverPage" aria-label="Обложка дневника">
        <img class="cover-art" src="images/cover.jpg" alt="Розовая обложка дневника Saints, the anglerfish, and checkmate">
        <button class="cover-open" id="openDiary" type="button" aria-label="Открыть дневник">
          <span>открыть дневник</span><span aria-hidden="true"> →</span>
        </button>
      </section>

      <section class="spread" id="spread" aria-label="Первый разворот" hidden>
        <article class="paper-page owner-page" id="ownerPage">
          <img src="images/owner-page.png" alt="Страница с информацией о владельце дневника">
          <button class="music-toggle" id="musicToggle" type="button" aria-label="Включить музыку" aria-pressed="false">
            <span class="music-symbol" aria-hidden="true">♫</span>
            <span class="music-caption">music</span>
          </button>
        </article>

        <article class="paper-page contents-page" id="contentsPage" aria-label="Содержание дневника">
          <div class="contents-decoration" aria-hidden="true">✧　♡　✧</div>
          <p class="eyebrow">a little guide to this diary</p>
          <h1>Содержание</h1>
          <p class="contents-note">выбери страницу, которую хочешь открыть</p>
          <nav class="contents-list" aria-label="Разделы дневника">
            <button type="button" data-section="handshakes"><span class="number">01</span><span>Рукопожатия</span><span class="arrow">↗</span></button>
            <button type="button" data-section="do-not-read"><span class="number">02</span><span>НЕ ЧИТАТЬ</span><span class="arrow">↗</span></button>
            <button type="button" data-section="new-world"><span class="number">03</span><span>Изучение Нового Диковинного Мира</span><span class="arrow">↗</span></button>
            <button type="button" data-section="on-repeat"><span class="number">04</span><span>На репите</span><span class="arrow">↗</span></button>
            <button type="button" data-section="museum"><span class="number">05</span><span>Музей</span><span class="arrow">↗</span></button>
            <button type="button" data-section="stickers"><span class="number">06</span><span>Наклейки</span><span class="arrow">↗</span></button>
          </nav>
          <p class="coming-soon">✧ новые страницы — в разработке ✧</p>
          <span class="page-number">02</span>
        </article>
      </section>

      <section class="paper-page section-page" id="sectionPage" hidden>
        <div class="section-topline"><span>SAINTS, THE ANGLERFISH, AND CHECKMATE</span><span>MY DIARY</span></div>
        <div class="section-inner">
          <p class="eyebrow">a page from my diary</p>
          <h1 id="sectionTitle">Раздел</h1>
          <p class="section-placeholder">Здесь скоро появится содержимое этой страницы.</p>
          <div class="doodle" aria-hidden="true">♡　✧　୨୧</div>
        </div>
        <span class="page-number">✧</span>
      </section>
    </div>

    <nav class="page-controls" aria-label="Навигация по дневнику">
      <button id="backButton" type="button" disabled>← назад</button>
      <span id="pageStatus">обложка</span>
      <button id="nextButton" type="button">открыть →</button>
    </nav>
  </main>

  <audio id="diaryAudio" src="music/soundtrack.mp3" preload="none" loop></audio>
  <script src="script.js"></script>
</body>
</html>
